

name: DevSecBot Security Scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Original Code Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config sql-injection.yml \
            --json \
            --output semgrep-findings.json \
            --exclude=patched_project/** \
            .

      - name: Upload Original Scan Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep-findings.json
          if-no-files-found: warn

  rescan-patched-project:
    runs-on: ubuntu-latest
    needs: semgrep-scan
    if: always()

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Check for patched project
        run: |
          if [ ! -d "patched_project" ]; then
            echo "ERROR: Patched project directory not found."
            exit 1
          fi

          PYTHON_FILES=$(find patched_project -type f -name '*.py' | wc -l)

          if [ "$PYTHON_FILES" -eq 0 ]; then
            echo "ERROR: No patched Python files found."
            exit 1
          fi

          echo "Patched project found."
          echo "Python files available: $PYTHON_FILES"

      - name: Rescan Full Patched Project
        run: |
          semgrep scan \
            --error \
            --config p/security-audit \
            --config sql-injection.yml \
            --json \
            --output patched-findings.json \
            patched_project/

      - name: Upload Patched Scan Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-findings
          path: patched-findings.json
          if-no-files-found: warn
