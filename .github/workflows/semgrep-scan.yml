
name: DevSecBot Security Scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # Job 1: Scan the original repository code
  semgrep-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config sql-injection.yml \
            --json \
            --output semgrep-findings.json \
            .

      - name: Upload Scan Findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep-findings.json
          if-no-files-found: warn

  # Job 2: Rescan patched Python files
  rescan-patched-files:
    needs: semgrep-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Check for patched files
        id: check
        shell: bash
        run: |
          if [ -d "Backend/patched_files" ] && \
             find Backend/patched_files -name "*.py" -print -quit | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rescan patched Python files
        if: steps.check.outputs.exists == 'true'
        run: |
          semgrep scan \
            --config p/security-audit \
            --config sql-injection.yml \
            --json \
            --output patched-findings.json \
            Backend/patched_files/

      - name: Upload patched scan findings
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patched-semgrep-findings
          path: patched-findings.json
          if-no-files-found: warn

